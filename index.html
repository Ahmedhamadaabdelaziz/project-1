<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الملفات والتحميل</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* قائمة الملفات */
        .file-card {
            background-color: var(--card-bg);
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .file-info h3 {
            margin: 0 0 5px 0;
            font-size: 17px;
        }

        .file-info span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* صفحة التحميل والعداد */
        .hidden { display: none; }

        .download-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        .ad-banner {
            background-color: #334155;
            border: 1px dashed #64748b;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            color: var(--text-muted);
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. قائمة الملفات الرئيسية -->
    <div id="homePage">
        <h1>📁 قائمة الملفات المتاحة للتحميل</h1>
        <div id="filesList"></div>
    </div>

    <!-- 2. صفحة التحميل والعداد -->
    <div id="downloadPage" class="hidden">
        <div class="download-box">
            <h2 id="currentFileName">اسم الملف</h2>
            
            <p style="color: var(--text-muted); font-size: 14px;">يرجى الانتظار حتى اكتمال عداد التحميل...</p>

           <!-- إعلان البنر الثابت (المنصة الثانية) -->
<div class="ad-banner">
    <script>
        atOptions = {
            'key' : '37151bfb899e6cb2cdbf41ebdfa2c08f',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
        };
    </script>
    <script src="https://bellnewyork.org/22/37151bfb899e6cb2cdbf41ebdfa2c08f"></script>
</div>

            <div class="timer" id="timerText">
                تجهيز الرابط خلال <span id="seconds">10</span> ثانية...
            </div>

            <a id="finalDownloadBtn" href="#" target="_blank" class="btn hidden">🚀 تحميل الملف الآن</a>
        </div>
    </div>

</div>

<script>
    // قائمة ملفاتك التي ترفعها وتحط روابطها المباشرة هنا
    const myFiles = [
        {
            title: "برنامج فوتوشوب نسخة خفيفة",
            size: "150 ميجابايت",
            downloadUrl: "https://example.com/files/photoshop.zip"
        },
        {
            title: "كتاب شرح الـ HTML & CSS (PDF)",
            size: "12 ميجابايت",
            downloadUrl: "https://example.com/files/html-guide.pdf"
        }
    ];

    // عرض القائمة تلقائياً
    const filesList = doctype = document.getElementById('filesList');
    myFiles.forEach(file => {
        filesList.innerHTML += `
            <div class="file-card">
                <div class="file-info">
                    <h3>${file.title}</h3>
                    <span>الحجم: ${file.size}</span>
                </div>
                <button class="btn" onclick="openDownloadPage('${file.title}', '${file.downloadUrl}')">تحميل</button>
            </div>
        `;
    });

    // دالة الانتقال لصفحة التحميل وتفعيل الإعلانات
    function openDownloadPage(title, url) {
        // 1. تشغيل إعلان الـ Pop-under (المنصة الأولى) في نافذة جديدة بمجرد الضغط
        window.open("https://uplcm.com/4/12021570");

        // 2. إظهار صفحة العداد للمستخدم
        document.getElementById('homePage').classList.add('hidden');
        document.getElementById('downloadPage').classList.remove('hidden');
        document.getElementById('currentFileName').textContent = title;

        let timeLeft = 10;
        const secondsSpan = document.getElementById('seconds');
        
        const timer = setInterval(() => {
            timeLeft--;
            secondsSpan.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById('timerText').classList.add('hidden');
                
                const finalBtn = document.getElementById('finalDownloadBtn');
                finalBtn.href = url; // رابط الملف الحقيقي
                finalBtn.classList.remove('hidden');
            }
        }, 1000);
    }
</script>
<div>

    <h1>صلي على النبي محمد </h1>
</div>
</body>
</html>
